[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qautollm"
version = "0.1.0"
description = "QAutoLLM-RAG: budget-aware multi-objective optimization of RAG pipeline configurations with classical and quantum-kernel Bayesian Optimization."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["qautollm*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["qautollm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: downloads small HF models (embedding/reranker/NLI) and runs real CPU inference",
]
